<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe7" />
  <title>The House of Unkept Promises</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Back">‹</button>
      <div class="brand" id="brand">The House of Unkept Promises</div>
      <button id="settingsBtn" class="icon-btn" aria-label="Reader settings">Aa</button>
    </header>

    <main id="homeView" class="view">
      <section class="hero">
        <img src="cover.png" alt="Book cover" class="cover" />
        <div class="hero-copy">
          <div class="eyebrow">Interactive Reader</div>
          <h1>The House of Unkept Promises</h1>
          <p>A contemporary Indian fantasy</p>
          <button id="continueBtn" class="primary">Start Reading</button>
        </div>
      </section>
      <nav class="tabs" aria-label="Book sections">
        <button data-tab="contents" class="tab active">Contents</button>
        <button data-tab="search" class="tab">Search</button>
        <button data-tab="bookmarks" class="tab">Bookmarks</button>
      </nav>
      <section id="tabPanel"></section>
    </main>

    <main id="readerView" class="view hidden">
      <div id="progressBar"><span></span></div>
      <article class="reader-card">
        <div id="chapterPart" class="eyebrow"></div>
        <h2 id="chapterTitle"></h2>
        <div id="chapterSubtitle" class="chapter-subtitle"></div>
        <div id="chapterBody"></div>
      </article>
      <div class="reader-nav">
        <button id="prevChapter" class="secondary">← Previous</button>
        <button id="bookmarkBtn" class="secondary">☆ Bookmark</button>
        <button id="nextChapter" class="secondary">Next →</button>
      </div>
    </main>
  </div>

  <div id="settingsSheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <div class="sheet-head"><strong>Reader settings</strong><button id="closeSettings" class="icon-btn">×</button></div>
      <div class="setting-row"><span>Text size</span><div><button id="fontDown" class="secondary">A−</button><button id="fontUp" class="secondary">A+</button></div></div>
      <div class="setting-row"><span>Theme</span><button id="themeToggle" class="secondary">Toggle light/dark</button></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
